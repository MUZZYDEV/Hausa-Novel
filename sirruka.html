<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundin Mallam Musa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .gallery-container {
            max-width: 800px;
            margin: auto;
            border: 2px solid #ddd;
            background: white;
            padding: 10px;
            border-radius: 5px;
        }

        .preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .download-btn {
            display: block;
            text-decoration: none;
            background: #007bff;
            color: white;
            padding: 10px;
            margin: 10px auto;
            width: 150px;
            border-radius: 5px;
        }

        .thumbnails {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
        }

        .thumbnails img {
            width: 100px;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .thumbnails img:hover {
            border: 2px solid #007bff;
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <img id="mainImage" class="preview" src="cover.jpg" alt="Preview Image">
        <a id="downloadBtn" class="download-btn" href="https://via.placeholder.com/800x300" download="image.jpg">Download Image</a>

        <div class="thumbnails">
            <img src="asrar1.jpg" onclick="changeImage(this)">
            <img src="asrar2.jpg" onclick="changeImage(this)">
            <img src="asrar3.jpg" onclick="changeImage(this)">
            <img src="asrar4.jpg" onclick="changeImage(this)">
            <img src="asrar5.jpg" onclick="changeImage(this)">
            <img src="asrar6.jpg" onclick="changeImage(this)">
            <img src="asrar7.jpg" onclick="changeImage(this)">
            <img src="asrar8.jpg" onclick="changeImage(this)">
            <img src="asrar9.jpg" onclick="changeImage(this)">
            <img src="asrar10.jpg" onclick="changeImage(this)">
        </div>
        <div class="gallery-container">
            <p>
                Hotunan sama na sirrukan da kuke ganin su kanana idan kuka danna su zasu kara girma wanda zaku samu damar karanta abunda yake ciki sannan zaku samu damar downloading dinsu
            </p>
        </div>
        <script async="async" data-cfasync="false" src="//yapabbreviate.com/d19d53bc8b06e90e66407416db4bf2f8/invoke.js"></script> <div id="container-d19d53bc8b06e90e66407416db4bf2f8"></div>
    </div>

    <script>
        function changeImage(img) {
            let mainImage = document.getElementById("mainImage");
            let downloadBtn = document.getElementById("downloadBtn");

            mainImage.src = img.src;
            downloadBtn.href = img.src;
        }
    </script>
<script type='text/javascript' src='//yapabbreviate.com/ec/0d/ed/ec0ded13c7154d57962416ab7530db17.js'></script>
</body>
</html>
